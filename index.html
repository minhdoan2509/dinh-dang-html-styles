<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Định dạng văn bản với HTML Styles</title>
</head>
<body>

    <!-- Tiêu đề màu xanh dương -->
    <h1 style="color: blue;">Bài viết của tôi</h1>

    <!-- Đoạn văn màu đỏ và chữ in đậm -->
    <p style="color: red; font-weight: bold;">Đây là đoạn văn được định dạng màu sắc.</p>

    <!-- Đoạn văn chữ in nghiêng và căn giữa -->
    <p style="font-style: italic; text-align: center;">Tôi đang học HTML Styles.</p>

    <!-- Đoạn văn cuối cùng kích thước chữ 20px và gạch chân -->
    <p style="font-size: 20px; text-decoration: underline;">Định dạng văn bản giúp trang web đẹp hơn.</p>

</body>
</html>
